[package]
name = "mcscan"
version = "0.2.0"
edition = "2021"
description = "Fast multi-threaded Minecraft world inventory scanner / editor (finds and fixes illegal items)"
license = "MIT"
repository = "https://github.com/WaffleTraits/mcscan"
readme = "README.md"
keywords = ["minecraft", "nbt", "anvil", "scanner", "cli"]
categories = ["command-line-utilities", "games"]
exclude = ["/dist", "/fabric-mod"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# zlib-rs: pure-Rust inflate, about 1.5x faster than the default backend here.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = "0.11"
ratatui = "0.29"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
